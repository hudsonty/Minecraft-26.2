<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Eaglercraft 26.2 Singleplayer</title>
  <style>
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #000; }
    #game { width: 100%; height: 100%; border: 0; display: block; background: #000; }
    #status { position: fixed; inset: 0; display: grid; place-items: center; background: #000; color: #fff; font: 16px Arial, sans-serif; z-index: 2; }
    #status a { color: #8bd7ff; }
    #status.error { color: #ffb4b4; }
  </style>
</head>
<body>
  <div id="status">Loading Eaglercraft 26.2...</div>
  <iframe id="game" title="Eaglercraft 26.2 Singleplayer" allow="autoplay; fullscreen; gamepad; pointer-lock; keyboard-map" allowfullscreen referrerpolicy="no-referrer" hidden></iframe>
  <script>
    (() => {
      const base = 'https://cdn.jsdelivr.net/gh/StaticQuasar931/26.2@main/';
      const parts = [
        'eaglercraft-26.2-single-a07aaa7656796892.part-001.html',
        'eaglercraft-26.2-single-a07aaa7656796892.part-002.html',
        'eaglercraft-26.2-single-a07aaa7656796892.part-003.html',
        'eaglercraft-26.2-single-a07aaa7656796892.part-004.html'
      ];
      const status = document.getElementById('status');
      const frame = document.getElementById('game');

      const fail = (error) => {
        console.error('Unable to load the Eaglercraft 26.2 chunks.', error);
        status.className = 'error';
        status.innerHTML = 'The game could not be loaded. Check that all chunk files are in the 26.2 GitHub repository.';
      };

      Promise.all(parts.map((part) => fetch(base + part).then((response) => {
        if (!response.ok) throw new Error(`${part}: HTTP ${response.status}`);
        return response.text();
      }))).then((chunks) => {
        const game = new Blob(chunks, { type: 'text/html' });
        frame.src = URL.createObjectURL(game);
        frame.hidden = false;
        frame.addEventListener('load', () => { status.hidden = true; }, { once: true });
      }).catch(fail);
    })();
  </script>
</body>
</html>
